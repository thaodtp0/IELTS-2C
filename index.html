<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS 2C - Practice Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #FBF9F1; color: #2D3748; }
        h1, h2 { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="min-h-screen py-12 px-4">
    <!-- PAGE TITLE -->
    <div class="max-w-3xl mx-auto text-center space-y-3 mb-10">
        <h1 class="text-4xl md:text-5xl font-bold text-slate-800 tracking-wide">IELTS 2C</h1>
        <p class="text-slate-600 font-medium text-sm md:text-base">
            Collection of practice materials categorized by semesters and lessons.
        </p>
        <div class="w-1/2 mx-auto border-b-2 border-slate-300 pt-2"></div>
    </div>

    <div class="max-w-3xl mx-auto space-y-6">

        <!-- ================= SEMESTER 6 (CURRENT) ================= -->
        <details open class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group">
            <summary class="flex justify-between items-center p-5 bg-amber-50/60 font-bold text-xl text-amber-900 cursor-pointer select-none">
                <span>📚 Semester 6 <span class="text-xs bg-amber-200 text-amber-800 px-2 py-1 rounded-full ml-2">Current</span></span>
                <span class="text-sm text-slate-400 group-open:rotate-180 transition-transform">▼</span>
            </summary>
            <div id="semester6-lessons" class="p-4 space-y-2">
                <div class="p-4 text-center text-slate-400 text-sm animate-pulse">Loading lessons...</div>
            </div>
        </details>

        <!-- ================= SEMESTER 5 ================= -->
        <details class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group">
            <summary class="flex justify-between items-center p-5 bg-slate-50 font-bold text-xl text-slate-700 cursor-pointer select-none">
                <span>📚 Semester 5</span>
                <span class="text-sm text-slate-400 group-open:rotate-180 transition-transform">▼</span>
            </summary>
            <div id="semester5-lessons" class="p-4 space-y-2">
                <div class="p-4 text-center text-slate-400 text-sm animate-pulse">Loading lessons...</div>
            </div>
        </details>

        <!-- ================= SEMESTER 7 (UPCOMING) ================= -->
        <details class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group">
            <summary class="flex justify-between items-center p-5 bg-slate-50 font-bold text-xl text-slate-700 cursor-pointer select-none">
                <span>📚 Semester 7</span>
                <span class="text-sm text-slate-400 group-open:rotate-180 transition-transform">▼</span>
            </summary>
            <div id="semester7-lessons" class="p-4 space-y-2">
                <div class="p-4 text-center text-slate-400 text-sm animate-pulse">Loading lessons...</div>
            </div>
        </details>

    </div>

    <script>
        const OWNER = window.location.hostname.split('.')[0] || 'thaodtp0';
        const REPO = 'IELTS-2C';
        const BRANCH = 'main';

        // Folder structure -> semester
        //   S5: lessonN/index.html            (root folder, old structure)
        //   S6: s6/lessonN/index.html
        //   S7: s7/lessonN/index.html  (will appear automatically once you create it)
        const SEMESTERS = [
            { prefix: '',    containerId: 'semester5-lessons' },
            { prefix: 's6/', containerId: 'semester6-lessons' },
            { prefix: 's7/', containerId: 'semester7-lessons' }
        ];

        const EMPTY_HTML = `<div class="p-4 text-center text-slate-400 text-sm italic">No lessons available yet.</div>`;

        function renderLessons(containerId, lessons) {
            const container = document.getElementById(containerId);
            if (lessons.length === 0) {
                container.innerHTML = EMPTY_HTML;
                return;
            }

            container.innerHTML = lessons.map((lesson, index) => {
                const formattedNum = String(lesson.num).padStart(2, '0');
                const borderClass = index < lessons.length - 1 ? 'border-b border-slate-100' : '';
                return `
                    <div class="flex items-center justify-between p-4 hover:bg-slate-50 rounded-lg transition ${borderClass}">
                        <div class="flex items-center space-x-4">
                            <span class="text-lg font-bold text-amber-700 font-mono">${formattedNum}</span>
                            <span class="font-bold text-slate-800">Lesson ${lesson.num}</span>
                        </div>
                        <a href="./${lesson.path}" class="text-sm font-bold text-slate-700 underline hover:text-sky-600 transition">Open Exercise</a>
                    </div>
                `;
            }).join('');
        }

        async function loadAllLessons() {
            try {
                // One single API request returns every file path in the repo
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
                if (!response.ok) throw new Error('Repo not found or rate limit reached');
                const data = await response.json();

                // Keep only paths like "lesson3/index.html" or "s6/lesson1/index.html"
                const indexFiles = (data.tree || [])
                    .filter(item => item.type === 'blob')
                    .map(item => item.path)
                    .filter(path => /^(s\d+\/)?lesson\d+\/index\.html$/i.test(path));

                SEMESTERS.forEach(sem => {
                    const lessons = indexFiles
                        .filter(path => {
                            const rest = sem.prefix ? (path.toLowerCase().startsWith(sem.prefix) ? path.slice(sem.prefix.length) : null) : (/^lesson/i.test(path) ? path : null);
                            return rest !== null;
                        })
                        .map(path => {
                            const match = path.match(/lesson(\d+)\/index\.html$/i);
                            return { num: parseInt(match[1], 10), path };
                        })
                        .sort((a, b) => a.num - b.num);

                    renderLessons(sem.containerId, lessons);
                });
            } catch (error) {
                SEMESTERS.forEach(sem => {
                    document.getElementById(sem.containerId).innerHTML = EMPTY_HTML;
                });
            }
        }

        document.addEventListener('DOMContentLoaded', loadAllLessons);
    </script>
</body>
</html>
