<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS 2C - Practice Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #FBF9F1; color: #2D3748; }
        h1, h2 { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="min-h-screen py-12 px-4">
    <!-- PAGE TITLE -->
    <div class="max-w-3xl mx-auto text-center space-y-3 mb-10">
        <h1 class="text-4xl md:text-5xl font-bold text-slate-800 tracking-wide">IELTS 2C</h1>
        <p class="text-slate-600 font-medium text-sm md:text-base">
            Collection of practice materials categorized by semesters and lessons.
        </p>
        <div class="w-1/2 mx-auto border-b-2 border-slate-300 pt-2"></div>
    </div>

    <!-- Semester blocks are created by the script below -->
    <div id="semesters" class="max-w-3xl mx-auto space-y-6"></div>

    <script>
        /* ============ SETTINGS ============ */
        const REPO = 'IELTS-2C';          // repository name
        const SEMESTERS = [5, 6, 7];      // add a number here (for example 8) to add a new semester block
        const CACHE_MINUTES = 5;          // how long the folder list is remembered in the browser
        /* ================================= */

        const host = window.location.hostname;
        const username = host.endsWith('.github.io') ? host.split('.')[0] : 'thaodtp0';

        /*
          Folder names that are recognised:
            lesson1, lesson2 ...        -> Semester 5 (old names, still work)
            s5-lesson1, s6-lesson1 ...  -> the semester written after the letter s
        */
        function parseFolder(name) {
            const m = name.match(/^(?:s(\d+)[-_ ]?)?lesson[-_ ]?(\d+)$/i);
            if (!m) return null;
            return { sem: m[1] ? parseInt(m[1], 10) : 5, num: parseInt(m[2], 10) };
        }

        function buildShell() {
            document.getElementById('semesters').innerHTML = SEMESTERS.map(n => `
                <details id="sem-${n}" data-sem="${n}" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group">
                    <summary id="sum-${n}" class="flex justify-between items-center p-5 bg-slate-50 font-bold text-xl text-slate-700 cursor-pointer select-none">
                        <span>📚 Semester ${n} <span id="badge-${n}" class="hidden text-xs bg-amber-200 text-amber-800 px-2 py-1 rounded-full ml-2">Current</span></span>
                        <span class="text-sm text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div id="sem${n}-lessons" class="p-4 space-y-2">
                        <div class="p-4 text-center text-slate-400 text-sm animate-pulse">Loading lessons...</div>
                    </div>
                </details>`).join('');
        }

        function emptyMessage(text) {
            return `<div class="p-4 text-center text-slate-400 text-sm italic">${text || 'No lessons available yet.'}</div>`;
        }

        function renderSemester(sem, folders) {
            const box = document.getElementById(`sem${sem}-lessons`);
            if (!box) return;
            if (!folders.length) { box.innerHTML = emptyMessage(); return; }
            folders.sort((a, b) => a.num - b.num);
            box.innerHTML = folders.map((f, i) => {
                const border = i < folders.length - 1 ? 'border-b border-slate-100' : '';
                const num = String(f.num).padStart(2, '0');
                return `
                    <div class="flex items-center justify-between p-4 hover:bg-slate-50 rounded-lg transition ${border}">
                        <div class="flex items-center space-x-4">
                            <span class="text-lg font-bold text-amber-700 font-mono">${num}</span>
                            <span class="font-bold text-slate-800">Lesson ${f.num}</span>
                        </div>
                        <a href="./${f.name}/index.html" class="text-sm font-bold text-slate-700 underline hover:text-sky-600 transition">Open Exercise</a>
                    </div>`;
            }).join('');
        }

        /* The newest semester that has lessons becomes "Current" and opens by itself */
        function markCurrent(current) {
            SEMESTERS.forEach(n => {
                const isCur = n === current;
                const details = document.getElementById(`sem-${n}`);
                const summary = document.getElementById(`sum-${n}`);
                document.getElementById(`badge-${n}`).classList.toggle('hidden', !isCur);
                summary.className = 'flex justify-between items-center p-5 font-bold text-xl cursor-pointer select-none ' +
                    (isCur ? 'bg-amber-50/60 text-amber-900' : 'bg-slate-50 text-slate-700');
                if (isCur) details.setAttribute('open', ''); else details.removeAttribute('open');
            });
        }

        async function getFolders() {
            const key = `ielts2c-folders:${username}/${REPO}`;
            try {
                const c = JSON.parse(sessionStorage.getItem(key) || 'null');
                if (c && Date.now() - c.time < CACHE_MINUTES * 60000) return c.names;
            } catch (e) {}
            const res = await fetch(`https://api.github.com/repos/${username}/${REPO}/contents/`);
            if (!res.ok) throw new Error('GitHub answered ' + res.status);
            const data = await res.json();
            const names = data.filter(item => item.type === 'dir').map(item => item.name);
            try { sessionStorage.setItem(key, JSON.stringify({ time: Date.now(), names })); } catch (e) {}
            return names;
        }

        async function init() {
            buildShell();
            try {
                const names = await getFolders();
                const bySem = {};
                SEMESTERS.forEach(n => { bySem[n] = []; });
                names.forEach(name => {
                    const info = parseFolder(name);
                    if (info && bySem[info.sem]) bySem[info.sem].push({ name, num: info.num });
                });
                SEMESTERS.forEach(n => renderSemester(n, bySem[n]));
                const withLessons = SEMESTERS.filter(n => bySem[n].length > 0);
                markCurrent(withLessons.length ? Math.max(...withLessons) : SEMESTERS[0]);
            } catch (error) {
                SEMESTERS.forEach(n => { document.getElementById(`sem${n}-lessons`).innerHTML = emptyMessage('Could not load the lessons. Please try again in a few minutes.'); });
                markCurrent(SEMESTERS[0]);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
