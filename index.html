<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS 2A - Practice Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #FBF9F1; color: #2D3748; }
        h1, h2 { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="min-h-screen py-12 px-4">
    <!-- PAGE TITLE -->
    <div class="max-w-3xl mx-auto text-center space-y-3 mb-10">
        <h1 class="text-4xl md:text-5xl font-bold text-slate-800 tracking-wide">IELTS 2A</h1>
        <p class="text-slate-600 font-medium text-sm md:text-base">
            Collection of practice materials categorized by semesters and lessons.
        </p>
        <div class="w-1/2 mx-auto border-b-2 border-slate-300 pt-2"></div>
    </div>

    <div class="max-w-3xl mx-auto space-y-6">

        <!-- ================= SEMESTER 5 (CURRENT) ================= -->
        <details open class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group">
            <summary class="flex justify-between items-center p-5 bg-amber-50/60 font-bold text-xl text-amber-900 cursor-pointer select-none">
                <span>📚 Semester 5 <span class="text-xs bg-amber-200 text-amber-800 px-2 py-1 rounded-full ml-2">Current</span></span>
                <span class="text-sm text-slate-400 group-open:rotate-180 transition-transform">▼</span>
            </summary>
            
            <div class="p-4 space-y-2">
                <!-- Lesson 1 -->
                <div class="flex items-center justify-between p-4 hover:bg-slate-50 rounded-lg transition border-b border-slate-100">
                    <div class="flex items-center space-x-4">
                        <span class="text-lg font-bold text-amber-700 font-mono">01</span>
                        <span class="font-bold text-slate-800">Lesson 1</span>
                    </div>
                    <a href="./lesson1/index.html" class="text-sm font-bold text-slate-700 underline hover:text-sky-600 transition">Open Exercise</a>
                </div>

                <!-- Lesson 2 -->
                <div class="flex items-center justify-between p-4 hover:bg-slate-50 rounded-lg transition border-b border-slate-100">
                    <div class="flex items-center space-x-4">
                        <span class="text-lg font-bold text-amber-700 font-mono">02</span>
                        <span class="font-bold text-slate-800">Lesson 2</span>
                    </div>
                    <a href="./lesson2/index.html" class="text-sm font-bold text-slate-700 underline hover:text-sky-600 transition">Open Exercise</a>
                </div>

                <!-- Lesson 3 -->
                <div class="flex items-center justify-between p-4 hover:bg-slate-50 rounded-lg transition">
                    <div class="flex items-center space-x-4">
                        <span class="text-lg font-bold text-amber-700 font-mono">03</span>
                        <span class="font-bold text-slate-800">Lesson 3</span>
                    </div>
                    <a href="./lesson3/index.html" class="text-sm font-bold text-slate-700 underline hover:text-sky-600 transition">Open Exercise</a>
                </div>
            </div>
        </details>

        <!-- ================= SEMESTER 6 (UPCOMING) ================= -->
        <details class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group">
            <summary class="flex justify-between items-center p-5 bg-slate-50 font-bold text-xl text-slate-700 cursor-pointer select-none">
                <span>📚 Semester 6</span>
                <span class="text-sm text-slate-400 group-open:rotate-180 transition-transform">▼</span>
            </summary>
            
            <div class="p-4 space-y-2">
                <div class="flex items-center justify-between p-4 hover:bg-slate-50 rounded-lg transition">
                    <div class="flex items-center space-x-4">
                        <span class="text-lg font-bold text-slate-500 font-mono">01</span>
                        <span class="font-bold text-slate-800">Lesson 1</span>
                    </div>
                    <a href="#" class="text-sm font-bold text-slate-700 underline hover:text-sky-600 transition">Open Exercise</a>
                </div>
            </div>
        </details>

        <!-- ================= SEMESTER 7 (UPCOMING) ================= -->
        <details class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group">
            <summary class="flex justify-between items-center p-5 bg-slate-50 font-bold text-xl text-slate-700 cursor-pointer select-none">
                <span>📚 Semester 7</span>
                <span class="text-sm text-slate-400 group-open:rotate-180 transition-transform">▼</span>
            </summary>
            
            <div class="p-4 space-y-2">
                <div class="flex items-center justify-between p-4 hover:bg-slate-50 rounded-lg transition">
                    <div class="flex items-center space-x-4">
                        <span class="text-lg font-bold text-slate-500 font-mono">01</span>
                        <span class="font-bold text-slate-800">Lesson 1</span>
                    </div>
                    <a href="#" class="text-sm font-bold text-slate-700 underline hover:text-sky-600 transition">Open Exercise</a>
                </div>
            </div>
        </details>

    </div>
</body>
</html>
